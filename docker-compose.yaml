services:
  # =========================================================
  # POSTIZ
  # =========================================================
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.23.0
    container_name: postiz
    restart: always

    environment:
      # === Required Settings
      MAIN_URL: 'https://postiz.eds-labs.io'
      FRONTEND_URL: 'https://postiz.eds-labs.io'
      NEXT_PUBLIC_BACKEND_URL: 'https://postiz.eds-labs.io/api'

      JWT_SECRET: '${POSTIZ_JWT_SECRET}'

      DATABASE_URL: 'postgresql://postiz-user:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'

      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'

      IS_GENERAL: 'true'

      # Erst auf true setzen, nachdem dein Account angelegt wurde!
      DISABLE_REGISTRATION: 'false'

      RUN_CRON: 'true'

      # === Storage
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # =====================================================
      # SOCIAL MEDIA
      # =====================================================

      X_URL: ''
      X_API_KEY: ''
      X_API_SECRET: ''

      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''

      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''

      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''

      APPLE_CLIENT_ID: ''
      APPLE_TEAM_ID: ''
      APPLE_KEY_ID: ''
      APPLE_PRIVATE_KEY: ''

      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''

      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''

      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''

      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''

      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''

      TIKTOK_BUSINESS_CLIENT_ID: ''
      TIKTOK_BUSINESS_CLIENT_SECRET: ''

      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''

      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''

      TUMBLR_CLIENT_ID: ''
      TUMBLR_CLIENT_SECRET: ''

      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''

      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''

      MASTODON_URL: 'https://mastodon.social'
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''

      # =====================================================
      # OPENAI
      # =====================================================

      OPENAI_API_KEY: ''
      OPENAI_OAUTH_CLIENT_ID: ''

      # =====================================================
      # OTHER
      # =====================================================

      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''

      API_LIMIT: '30'

      FEE_AMOUNT: '0.05'

      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''

      NX_ADD_PLUGINS: 'false'

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/

    ports:
      - '4007:5000'

    networks:
      - postiz-network
      - temporal-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy


  # =========================================================
  # POSTIZ POSTGRESQL
  # =========================================================
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always

    environment:
      POSTGRES_PASSWORD: '${POSTIZ_DB_PASSWORD}'
      POSTGRES_USER: 'postiz-user'
      POSTGRES_DB: 'postiz-db-local'

    volumes:
      - postgres-volume:/var/lib/postgresql/data

    networks:
      - postiz-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postiz-user -d postiz-db-local"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================================================
  # POSTIZ REDIS
  # =========================================================
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always

    volumes:
      - postiz-redis-data:/data

    networks:
      - postiz-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # =========================================================
  # SENTRY SPOTLIGHT
  # Only started with the "debug" profile
  # =========================================================
  spotlight:
    profiles:
      - debug

    image: ghcr.io/getsentry/spotlight:latest
    container_name: spotlight
    pull_policy: always
    restart: unless-stopped

    ports:
      - '127.0.0.1:8969:8969'

    networks:
      - postiz-network


  # =========================================================
  # TEMPORAL ELASTICSEARCH
  # =========================================================
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: always

    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false

    networks:
      - temporal-network

    expose:
      - '9200'

    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s


  # =========================================================
  # TEMPORAL POSTGRESQL
  # =========================================================
  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    restart: always

    environment:
      POSTGRES_PASSWORD: '${TEMPORAL_DB_PASSWORD}'
      POSTGRES_USER: 'temporal'

    networks:
      - temporal-network

    expose:
      - '5432'

    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U temporal"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================================================
  # TEMPORAL SERVER
  # =========================================================
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: always

    ports:
      - '127.0.0.1:7233:7233'

    depends_on:
      temporal-postgresql:
        condition: service_healthy

      temporal-elasticsearch:
        condition: service_healthy

    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql

      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml

      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7

      - TEMPORAL_NAMESPACE=default

    networks:
      - temporal-network

    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

    labels:
      kompose.volume.type: configMap

    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "temporal:7233"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =========================================================
  # TEMPORAL ADMIN TOOLS
  # =========================================================
  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    container_name: temporal-admin-tools
    restart: on-failure

    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233

    networks:
      - temporal-network

    stdin_open: true
    tty: true

    depends_on:
      temporal:
        condition: service_healthy


  # =========================================================
  # TEMPORAL UI
  # Host port changed from 8080 -> 8081 because Coolify proxy
  # already uses port 8080.
  # Only available locally on the server.
  # =========================================================
  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    restart: always

    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000

    networks:
      - temporal-network

    ports:
      - '127.0.0.1:8081:8080'

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/healthz"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    depends_on:
      temporal:
        condition: service_healthy


# =========================================================
# PERSISTENT VOLUMES
# =========================================================
volumes:
  postgres-volume:
    external: false

  postiz-redis-data:
    external: false

  postiz-config:
    external: false

  postiz-uploads:
    external: false

  temporal-postgres-data:
    external: false

  temporal-elasticsearch-data:
    external: false


# =========================================================
# NETWORKS
# =========================================================
networks:
  postiz-network:
    external: false

  temporal-network:
    driver: bridge
    name: temporal-network
